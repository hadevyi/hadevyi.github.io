---
name: Discord GitHub 알림
'on':
  issues:
    types:
    - opened
  pull_request:
    types:
    - opened
  workflow_run:
    workflows:
    - Dependabot 병합 후 배포
    - Node.js CI
    - Project 이슈 상태 동기화
    - Sync shared labels
    - Deploy Astro site to GitHub Pages
    - Dependabot 조건부 자동 병합
    - PR 담당자 자동 지정
    - Issue 담당자 자동 지정
    types:
    - completed
permissions:
  contents: read
jobs:
  notify:
    uses: hadevyi/.github/.github/workflows/reusable-discord-notify.yml@4678ec5ffadaeda894ce67f580b76af898c8d729
    with:
      bot-name: Spark Bot
      success-workflows: Deploy Astro site to GitHub Pages
    secrets:
      DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"
