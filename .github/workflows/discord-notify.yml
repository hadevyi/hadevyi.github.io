---
name: Discord GitHub 알림
'on':
  issues:
    types:
    - opened
  issue_comment:
    types:
    - created
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  workflow_run:
    workflows:
    - Dependabot 병합 후 배포
    - Node.js CI
    - Project 이슈 상태 동기화
    - Sync shared labels
    - Deploy Astro site to GitHub Pages
    - Dependabot 조건부 자동 병합
    - PR 담당자 자동 지정
    - Issue 담당자 자동 지정
    types:
    - completed
permissions:
  contents: read
jobs:
  notify:
    uses: hadevyi/.github/.github/workflows/reusable-discord-notify.yml@d96d2e5a4211d4eaacf576db094f354adff87aef
    with:
      bot-name: Spark Bot
    secrets:
      DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"
